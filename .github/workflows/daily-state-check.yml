name: Daily MESH state check

# MESH currently supports local contracts, simulated/fixture adapters and
# hash-verified snapshots. This workflow validates that state and regenerates
# the honest capability registry; it does not turn SNAPSHOT or UNAVAILABLE
# sources into LIVE connections.
on:
  schedule:
    - cron: '0 10 * * *' # 10:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: risk-mesh-daily-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Validate the supported adapters and provenance boundaries
        run: bun test
      - name: Validate TypeScript without changing runtime status
        run: bun run typecheck
      - name: Refresh the generated capability registry
        run: bun run observatory:capture:registry
      - name: Commit only meaningful MESH state changes
        run: |
          git config user.name "risk-mesh-state-bot"
          git config user.email "actions@users.noreply.github.com"
          git add observatory/data/repo-registry.js
          if git diff --cached --quiet; then
            echo "NO_CHANGE: MESH registry and supported-source statuses unchanged."
            exit 0
          fi
          git commit -m "Daily MESH state refresh"
          git push
